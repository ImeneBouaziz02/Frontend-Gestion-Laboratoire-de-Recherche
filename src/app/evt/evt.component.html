<div class="container">
  <h2>Gestion des Événements</h2>
  
  <!-- Filtre et bouton Create -->
  <div class="header-section">
    <mat-form-field>
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Rechercher..." #input>
    </mat-form-field>
    
    <button mat-raised-button color="primary" (click)="open()">
      <mat-icon>add</mat-icon>
      Créer un événement
    </button>
  </div>

  <!-- Table des événements -->
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Colonne ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.id}} </td>
      </ng-container>

      <!-- Colonne Titre -->
      <ng-container matColumnDef="titre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Titre </th>
        <td mat-cell *matCellDef="let row"> {{row.titre}} </td>
      </ng-container>

      <!-- Colonne Date -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
        <td mat-cell *matCellDef="let row"> {{row.date | date:'dd/MM/yyyy'}} </td>
      </ng-container>

      <!-- Colonne Lieu -->
      <ng-container matColumnDef="lieu">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Lieu </th>
        <td mat-cell *matCellDef="let row"> {{row.lieu}} </td>
      </ng-container>

      <!-- Colonne Actions -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="openEdit(row.id)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="deleteEvent(row.id)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Message si aucune donnée -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">
          Aucun événement trouvé pour "{{input.value}}"
        </td>
      </tr>
    </table>

    <mat-paginator 
      [pageSizeOptions]="[5, 10, 25, 100]" 
      showFirstLastButtons
      aria-label="Sélectionner une page">
    </mat-paginator>
  </div>
</div>
