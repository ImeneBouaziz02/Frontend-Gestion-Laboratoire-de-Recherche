<h2 mat-dialog-title>
  {{ data ? 'Modifier Publication' : 'Ajouter Publication' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form">

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        <mat-option value="Article">Article</mat-option>
        <mat-option value="Conference">Conférence</mat-option>
        <mat-option value="Book">Livre</mat-option>
        <mat-option value="Book Chapter">Chapitre de livre</mat-option>
        <mat-option value="Thesis">Thèse</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('type')?.hasError('required')">
        Type obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Titre</mat-label>
      <input matInput formControlName="titre" placeholder="Titre de la publication">
      <mat-error *ngIf="form.get('titre')?.hasError('required')">
        Titre obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Lien</mat-label>
      <input matInput formControlName="lien" placeholder="https://example.com">
      <mat-error *ngIf="form.get('lien')?.hasError('required')">
        Lien obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" placeholder="jj/mm/aaaa">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="form.get('date')?.hasError('required')">
        Date obligatoire
      </mat-error>
    </mat-form-field>

    <!-- ✅ Corrigé : sourcePdf avec majuscule -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Source PDF (URL ou nom du fichier)</mat-label>
      <input matInput formControlName="sourcePdf" placeholder="document.pdf">
      <mat-error *ngIf="form.get('sourcePdf')?.hasError('required')">
        Source PDF obligatoire
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ data ? 'Modifier' : 'Créer' }}
  </button>
</mat-dialog-actions>
