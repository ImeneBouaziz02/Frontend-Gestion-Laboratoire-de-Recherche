<div class="container">
  <h2>Gestion des Publications</h2>

  <button mat-raised-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Ajouter Publication
  </button>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let p">{{ p.id }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let p">{{ p.type }}</td>
    </ng-container>

    <ng-container matColumnDef="titre">
      <th mat-header-cell *matHeaderCellDef>Titre</th>
      <td mat-cell *matCellDef="let p">{{ p.titre }}</td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let p">
        {{ p.date | date:'dd/MM/yyyy' }}
      </td>
    </ng-container>

    <!-- ✅ Corrigé : sourcePdf avec majuscule -->
    <ng-container matColumnDef="sourcepdf">
      <th mat-header-cell *matHeaderCellDef>Source PDF</th>
      <td mat-cell *matCellDef="let p">
        <a *ngIf="p.sourcePdf" [href]="p.sourcePdf" target="_blank">
          <mat-icon color="primary">picture_as_pdf</mat-icon>
        </a>
        <span *ngIf="!p.sourcePdf">-</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button color="primary" (click)="openEdit(p)" matTooltip="Modifier">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(p.id)" matTooltip="Supprimer">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Message si aucune donnée -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="6">Aucune publication trouvée</td>
    </tr>

  </table>
</div>
