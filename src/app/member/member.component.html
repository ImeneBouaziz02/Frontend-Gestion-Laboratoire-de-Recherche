
<button routerLink="/create"> Create New </button>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <ng-container matColumnDef="nom">
  <th mat-header-cell *matHeaderCellDef> Nom </th>
  <td mat-cell *matCellDef="let element"> {{ element.nom }} </td>
</ng-container>

<ng-container matColumnDef="prenom">
  <th mat-header-cell *matHeaderCellDef> Prénom </th>
  <td mat-cell *matCellDef="let element"> {{ element.prenom }} </td>
</ng-container>

<ng-container matColumnDef="email">
  <th mat-header-cell *matHeaderCellDef> Email </th>
  <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
</ng-container>

<ng-container matColumnDef="dateNaissance">
  <th mat-header-cell *matHeaderCellDef> Date Naissance </th>
  <td mat-cell *matCellDef="let element">
    {{ element.dateNaissance | date:'dd/MM/yyyy' }}
  </td>
</ng-container>


  <!-- CIN Column -->
  <ng-container matColumnDef="cin">
    <th mat-header-cell *matHeaderCellDef> CIN </th>
    <td mat-cell *matCellDef="let element"> {{element.cin}} </td>
  </ng-container>

  <!-- Type Column -->
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef> Type </th>
    <td mat-cell *matCellDef="let element"> {{element.type}} </td>
  </ng-container>

    <!-- CreateDate Column -->
  <ng-container matColumnDef="CreateDate">
    <th mat-header-cell *matHeaderCellDef> Creation Date </th>
    <td mat-cell *matCellDef="let element"> {{ element.createDate | date:'dd/MM/yyyy' }} </td>
  </ng-container>

    <!-- Action Column -->
<ng-container matColumnDef="action">
  <th mat-header-cell *matHeaderCellDef> Action </th>
  <td mat-cell *matCellDef="let element">
    <button mat-icon-button color="primary" routerLink="/{{element.id}}/edit">
      <mat-icon>edit</mat-icon>
    </button>

    <button mat-icon-button color="warn" (click)="delete(element.id)">
      <mat-icon>delete</mat-icon>
    </button>
    
  </td>
</ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
